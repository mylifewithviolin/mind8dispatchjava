name: Java regression

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '20'
      - name: Compile application and regression tests
        run: javac -encoding UTF-8 -d build src/mind8dispacher/*.java tests/RegressionTests.java
      - name: Run regression tests
        run: java -cp build mind8dispacher.RegressionTests
